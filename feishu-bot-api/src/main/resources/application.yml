server:
  port: 8080

spring:
  application:
    name: feishu-bot
  profiles:
    active: dev
  # 导入本地密钥文件（不上传 Git），文件不存在也不会报错
  config:
    import: optional:classpath:application-local.yml
  # 本项目没有实现/deploy指定,所以没有用到mq
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  # ============================================
  # 数据库 — MySQL
  # ============================================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/feishu_bot?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  # ============================================
  # Redis
  # ============================================
  data:
    redis:
      host: localhost
      port: 6379

      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4



  # ============================================
  # Spring AI
  # ============================================
  ai:
    openai:
      api-key:   ${DEEP_SEEK_API} #本地环境变量加载
      base-url:  https://api.deepseek.com
      chat:
        model: deepseek-chat

# ============================================
# MyBatis-Plus
# ============================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.bluemountain.bot #xml文件,但其实整个项目没有用到xml文件
  configuration:
    map-underscore-to-camel-case: true #驼峰映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #控制台打印sql日志
  global-config:
    db-config:
      id-type: auto #主键策略:自增
      logic-delete-field: deleted #逻辑删除
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================
# 飞书应用配置
# ============================================
feishu:
  app-id: cli_aa8c065435f9dbde
  app-secret: ${FEISHU_APP_SECRET} #写到本地环境变量去了
  encrypt-key: 
  verification-token:
  signature-verification-enabled: false # 未配置 encrypt_key 时保持 false，上线后改为 true
  approval-code: "7641525625807506610" # 请假审批定义 code
  review-chat-id: "oc_f751bd04fdf2ac64846673a7288c6721" # 代码审查结果发到哪个群

# Gitee
gitee:
  token: ${GITEE_TOKEN}

# ============================================
# AI 大模型（【待填】DeepSeek 等 OpenAI 兼容 API）
# ============================================
ai:
  api-key: ${AI_API_KEY:}
  model: deepseek-chat
  base-url: https://api.deepseek.com

# ============================================
# 第三方 API Key（【待填】按需填写）
# ============================================
integration:
  translate:
    baidu:
      app-id: ${BAIDU_APP_ID:}
      secret-key: ${BAIDU_SECRET_KEY:}

# ============================================
# 机器人行为配置
# ============================================
bot:
  name: 飞书超级助手
  max-dialog-turns: 10
  command-cooldown-seconds: 3
  admin-chat-id: 【填管理员群 ID，用于接收告警通知】

# ============================================
# 日志
# ============================================
logging:
  level:
    com.bluemountain: debug
    org.springframework.ai: debug
